apiVersion: v1
kind: ConfigMap
metadata:
  name: vkget
  namespace: vkget
data:
  DOWNLOAD_ROOT: /downloads
  COOKIE_FILE: /config/cookies.txt
  MAX_HEIGHT: "720"
  DOWNLOAD_RATE: "500K"
  MIN_GAP_MINUTES: "15"
  MIN_GAP_MAX_MINUTES: "30"
  DISCOVERY_INTERVAL_MIN_HOURS: "3"
  DISCOVERY_INTERVAL_MAX_HOURS: "6"
  FLARESOLVERR_URL: "http://flaresolverr.flaresolverr.svc.cluster.local:8191"
  VK_VPN_MODE: "auto"
  VPN_DISCOVERY_ENABLED: "true"
  VPN_DISCOVERY_INTERVAL_MINUTES: "30"
  VPN_GATEWAY_URL: "http://vkget-vpn-gateway.vkget.svc.cluster.local:8081"
  VPN_PROXY_URL: "socks5://vkget-vpn-gateway.vkget.svc.cluster.local:1080"
  VPN_MAX_ENDPOINT_ATTEMPTS: "6"
  VPN_CONNECT_TIMEOUT: "8"
  VPN_TCP_PROBE_TIMEOUT: "2"
  VPN_MANUAL_PRIORITY: "50"
  VPN_VERIFY_TIMEOUT: "10"
  VPN_MIN_DOWNLOAD_RATE: "300K"
  VPN_SLOW_RATE_DURATION: "120"
  VPN_STALE_AFTER_HOURS: "24"
  VPN_DISABLE_AFTER_DAYS: "7"
