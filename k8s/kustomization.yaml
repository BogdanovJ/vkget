apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - vpn-gateway-deployment.yaml
  - vpn-gateway-service.yaml

# Add encrypted secret files after creating them:
#  - secret.sops.yaml
#  - cookies-secret.sops.yaml

# Pin both images to the same short git SHA after Actions publishes it.
# Leave latest until that SHA exists on GHCR.
images:
  - name: ghcr.io/bogdanovj/vkget
    newTag: latest
  - name: ghcr.io/bogdanovj/vkget-vpn-gateway
    newTag: latest
